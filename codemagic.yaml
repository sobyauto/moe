workflows:
  ios-workflow:
    name: iOS Workflow
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
    scripts:
      - name: Generate project
        script: |
          brew install tuist 2>/dev/null || true
          tuist generate || tuist install && tuist generate || true
      - name: Build IPA
        script: |
          xcodebuild -workspace Median.xcworkspace -scheme Median -sdk iphoneos -configuration Release -archivePath build/Median.xcarchive archive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          mkdir -p build/Payload
          cp -R build/Median.xcarchive/Products/Applications/*.app build/Payload/
          cd build && zip -r MoeElectric.ipa Payload
    artifacts:
      - build/*.ipa
